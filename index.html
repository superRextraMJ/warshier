<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c3b">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Kasir sederhana untuk warung: pesan menu, hitung total, dan terima pembayaran tunai atau QRIS.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kasir Warung">
  <title>Kasir Warung</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/i18n.js" defer></script>
  <script src="./js/db.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <a id="skip-link" class="skip-link" href="#app">Langsung ke konten utama</a>

  <header id="app-header" class="app-header"></header>

  <main id="app" class="app-main" tabindex="-1">
    <div class="boot-screen" role="status">
      <div class="boot-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0Z"></path>
          <path d="M8.5 7.5c0-1.4 1.2-1.9 1.2-3.5M13.7 7.5c0-1.4 1.2-1.9 1.2-3.5"></path>
          <path d="M4 21h16"></path>
        </svg>
      </div>
      <h1>Memuat…</h1>
    </div>
  </main>

  <nav id="bottom-nav" class="mobile-nav" aria-label="Navigasi utama"></nav>

  <div id="toast-region" class="toast-region" role="status" hidden></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <dialog id="confirm-dialog" class="dialog"></dialog>
  <dialog id="pin-dialog" class="dialog"></dialog>
  <dialog id="item-dialog" class="dialog dialog-wide"></dialog>
  <dialog id="addon-dialog" class="dialog"></dialog>
  <dialog id="receipt-dialog" class="dialog dialog-receipt"></dialog>

  <div id="print-area" class="print-area" aria-hidden="true"></div>

  <noscript>
    <div class="noscript-message">
      <h1>JavaScript diperlukan / JavaScript is required</h1>
      <p>Aktifkan JavaScript untuk menggunakan aplikasi Kasir Warung. / Please enable JavaScript to use Kasir Warung.</p>
    </div>
  </noscript>
</body>
</html>
